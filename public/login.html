<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple M Hotspot - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 70%, rgba(0, 122, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 10% 80%, rgba(120, 0, 255, 0.05) 0%, transparent 50%);
            animation: bgMove 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(2%, 2%); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(0, 212, 255, 0.12) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #00d4ff, #007aff);
            border-radius: 18px;
            font-size: 28px;
            margin-bottom: 12px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); }
            50% { box-shadow: 0 0 50px rgba(0, 212, 255, 0.7); }
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .brand-name span { color: #00d4ff; }

        .brand-tagline {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.55;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            color: #fff;
            transition: all 0.3s;
        }

        .form-group input::placeholder { color: rgba(255, 255, 255, 0.28); }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff 0%, #007aff 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 122, 255, 0.45);
        }

        .btn-secondary {
            display: block;
            text-align: center;
            width: 100%;
            padding: 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00d4ff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.12);
            border-color: #00d4ff;
        }

        .btn-status {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px dashed rgba(0, 212, 255, 0.5);
            color: #00d4ff;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
            text-align: center;
        }

        .btn-status:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.18);
            font-size: 11px;
        }

        .alert-error {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 18px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="brand">
            <div class="brand-logo">📡</div>
            <div class="brand-name">Triple <span>M</span> Hotspot</div>
            <div class="brand-tagline">High Speed Internet Access</div>
        </div>

        <div class="card">
            <div class="card-title">Selamat Datang 👋</div>
            <div class="card-subtitle">Masukkan username dan password kamu</div>

            $(if error)
            <div class="alert-error" style="display: block;">
                $(error)
            </div>
            $(endif)

            <form name="login" action="$(link-login-only)" method="post">
                <input type="hidden" name="dst" value="$(link-orig)" />
                <input type="hidden" name="popup" value="true" />

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🏷️</span>
                        <input type="text" id="username" name="username" value="$(username)" required placeholder="Masukkan username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" name="password" required placeholder="Masukkan password">
                    </div>
                </div>

                <button type="submit" class="btn">Masuk ke Jaringan</button>
            </form>

            <div class="divider"><span>atau</span></div>

            <a href="register.html" class="btn-secondary">Belum Punya Akun? Daftar</a>
            <button type="button" class="btn-status" onclick="openStatusModal()">🔍 Cek Status Pendaftaran</button>
        </div>

        <div class="footer">© Triple M Hotspot · All rights reserved</div>
    </div>

    <div id="statusModal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #fff; font-size: 16px; margin-bottom: 6px;">Cek Status Akun</h3>
            <p style="font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 16px;">Masukkan username pendaftaran kamu:</p>
            
            <div class="form-group" style="margin-bottom: 12px;">
                <input type="text" id="checkUsernameInput" placeholder="Masukkan username..." style="padding: 10px 14px;">
            </div>
            
            <button type="button" class="btn" onclick="userCheckStatus()" style="margin-top: 0;">Cek Sekarang</button>
            
            <div id="statusResultBox" style="margin-top: 14px; font-size: 13px; font-weight: 500; min-height: 20px;"></div>

            <button type="button" onclick="closeStatusModal()" style="background: none; border: none; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; margin-top: 14px;">Tutup</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://3m-r3if.vercel.app';

        function openStatusModal() {
            document.getElementById('statusModal').style.display = 'flex';
            document.getElementById('statusResultBox').innerHTML = '';
            document.getElementById('checkUsernameInput').value = '';
        }

        function closeStatusModal() {
            document.getElementById('statusModal').style.display = 'none';
        }

        async function userCheckStatus() {
            const username = document.getElementById('checkUsernameInput').value.trim();
            const resultBox = document.getElementById('statusResultBox');

            if (!username) {
                resultBox.innerHTML = '<span style="color: #ff5252;">Username tidak boleh kosong!</span>';
                return;
            }

            resultBox.innerHTML = '<span style="color: #aaa;">Mengecek status...</span>';

            try {
                const response = await fetch(`${BACKEND_URL}/api/users/${username}`);
                const data = await response.json();

                if (data.success && data.user) {
                    const status = data.user.status;
                    if (status === 'approved') {
                        resultBox.innerHTML = '<span style="color: #00e676;">✅ Akun kamu SUDAH AKTIF! Silakan login.</span>';
                    } else if (status === 'pending') {
                        resultBox.innerHTML = '<span style="color: #ffc107;">⏳ Akun masih PENDING. Tunggu konfirmasi admin.</span>';
                    } else if (status === 'rejected') {
                        resultBox.innerHTML = '<span style="color: #ff5252;">❌ Pendaftaran kamu DITOLAK. Hubungi admin.</span>';
                    }
                } else {
                    resultBox.innerHTML = '<span style="color: #ff5252;">⚠️ Username tidak ditemukan.</span>';
                }
            } catch (error) {
                resultBox.innerHTML = '<span style="color: #ff5252;">⚠️ Gagal terhubung ke server.</span>';
            }
        }
    </script>
</body>
</html>
