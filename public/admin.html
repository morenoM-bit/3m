<!DOCTYPE html>
<html lang="id">
<head>
  <!-- ====================================================================
       JUDUL: DASHBOARD FRONTEND TERBARU + GRAFIK TRAFIK REALTIME
       NAMA FILE: index.html
       ==================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Triple M Hotspot</title>
  
  <!-- Font Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Pustaka Socket.io & Chart.js untuk Grafik Realtime -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- --------------------------------------------------------------------
       BAGIAN 1: DESAIN CSS / TAMPILAN
       -------------------------------------------------------------------- -->
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Modal Login */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .login-box {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--accent);
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    /* Layout Dashboard */
    .dashboard {
      display: none;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    /* Kartu Statistik Ringkasan */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .stat-card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* Wadah Grafik Realtime Traffic */
    .chart-box {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .chart-box h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    /* Tabel User */
    .table-container {
      background: var(--card-bg);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(255,255,255,0.02);
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-pending { background: rgba(234, 179, 8, 0.2); color: #fde047; }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .action-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 0.35rem;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      margin-right: 0.3rem;
    }

    .btn-approve { background: var(--success); color: white; }
    .btn-reject { background: var(--danger); color: white; }
    .btn-delete { background: var(--border); color: var(--text); }
  </style>
</head>
<body>

  <!-- --------------------------------------------------------------------
       BAGIAN 2: MODAL LOGIN ADMIN
       -------------------------------------------------------------------- -->
  <div class="login-modal" id="loginModal">
    <div class="login-box">
      <h2>Admin Login</h2>
      <div class="input-group">
        <label>Password Admin</label>
        <input type="password" id="adminPassword" placeholder="Masukkan password">
      </div>
      <button class="btn" onclick="login()">Masuk</button>
    </div>
  </div>

  <!-- --------------------------------------------------------------------
       BAGIAN 3: DASHBOARD UTAMA
       -------------------------------------------------------------------- -->
  <div class="dashboard" id="dashboard">
    <header>
      <h1>Triple M Hotspot</h1>
      <button class="action-btn btn-reject" onclick="logout()">Keluar</button>
    </header>

    <!-- Kartu Ringkasan User -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>TOTAL PENGGUNA</h3>
        <div class="value" id="totalUsers">0</div>
      </div>
      <div class="stat-card">
        <h3>MENUNGGU PERSETUJUAN</h3>
        <div class="value" id="pendingUsers">0</div>
      </div>
      <div class="stat-card">
        <h3>PENGGUNA AKTIF</h3>
        <div class="value" id="activeUsers">0</div>
      </div>
    </div>

    <!-- Grafik Realtime Traffic (Download & Upload) -->
    <div class="chart-box">
      <h3>Monitor Traffic Realtime (Mbps)</h3>
      <div class="chart-container">
        <canvas id="trafficChart"></canvas>
      </div>
    </div>

    <!-- Tabel Daftar Pengguna Hotspot -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Status</th>
            <th>Download</th>
            <th>Upload</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Data diisi secara dinamis oleh JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- --------------------------------------------------------------------
       BAGIAN 4: LOGIKA JAVASCRIPT FRONTEND
       -------------------------------------------------------------------- -->
  <script>
    // Konfigurasi URL Backend (Menggunakan localhost saat pengembangan)
    const BACKEND_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:5000' 
      : 'https://nama-proyek-kamu.vercel.app';

    let token = localStorage.getItem('adminToken');
    let socket;
    let trafficChart;

    if (token) {
      showDashboard();
    }

    // 4.1. Fungsi Login Admin
    async function login() {
      const password = document.getElementById('adminPassword').value;
      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
          token = data.token;
          localStorage.setItem('adminToken', token);
          showDashboard();
        } else {
          alert(data.message || 'Login gagal');
        }
      } catch (err) {
        alert('Gagal terhubung ke server backend');
      }
    }

    // 4.2. Fungsi Logout
    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    // 4.3. Menampilkan Dashboard setelah Login Sukses
    function showDashboard() {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadUsers();
      initTrafficChart(); // Inisialisasi Grafik Realtime
      initSocketConnection(); // Hubungkan ke WebSocket Backend
      setInterval(loadUsers, 30000); // Auto-refresh data user setiap 30 detik
    }

    // 4.4. Memuat Data User dari Backend API
    async function loadUsers() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          renderTable(data.users);
          updateStats(data.users);
        }
      } catch (err) {
        console.error('Gagal memuat data pengguna:', err);
      }
    }

    // 4.5. Menampilkan Data Pengguna ke Tabel
    function renderTable(users) {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.username}</td>
          <td><span class="badge badge-${u.status}">${u.status}</span></td>
          <td>${formatBytes(u.download || 0)}</td>
          <td>${formatBytes(u.upload || 0)}</td>
          <td>
            ${u.status === 'pending' ? `<button class="action-btn btn-approve" onclick="approveUser('${u.username}')">Approve</button>` : ''}
            ${u.status === 'pending' ? `<button class="action-btn btn-reject" onclick="rejectUser('${u.username}')">Reject</button>` : ''}
            <button class="action-btn btn-delete" onclick="deleteUser('${u.username}')">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 4.6. Mengupdate Kartu Statistik
    function updateStats(users) {
      document.getElementById('totalUsers').innerText = users.length;
      document.getElementById('pendingUsers').innerText = users.filter(u => u.status === 'pending').length;
      document.getElementById('activeUsers').innerText = users.filter(u => u.status === 'active').length;
    }

    // 4.7. Fungsi Aksi User (Approve, Reject, Delete)
    async function approveUser(username) {
      await fetch(`${BACKEND_URL}/api/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ username })
      });
      loadUsers();
    }

    async function rejectUser(username) {
      await fetch(`${BACKEND_URL}/api/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ username })
      });
      loadUsers();
    }

    async function deleteUser(username) {
      if (confirm(`Yakin hapus ${username}?`)) {
        await fetch(`${BACKEND_URL}/api/users/${username}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        loadUsers();
      }
    }

    // 4.8. Mengubah Format Byte ke KB, MB, GB
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // --------------------------------------------------------------------
    // 4.9. INISIALISASI GRAFIK REALTIME (CHART.JS)
    // --------------------------------------------------------------------
    function initTrafficChart() {
      const ctx = document.getElementById('trafficChart').getContext('2d');
      trafficChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'Download (Mbps)',
              borderColor: '#10b981', // Warna Hijau
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              data: [],
              fill: true,
              tension: 0.3
            },
            {
              label: 'Upload (Mbps)',
              borderColor: '#3b82f6', // Warna Biru
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              data: [],
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    // --------------------------------------------------------------------
    // 4.10. KONEKSI SOCKET.IO UNTUK UPDATE GRAFIK REALTIME
    // --------------------------------------------------------------------
    function initSocketConnection() {
      socket = io(BACKEND_URL);

      socket.on('trafficData', (data) => {
        const maxDataPoints = 15; // Jumlah titik waktu yang terlihat di grafik

        if (trafficChart.data.labels.length >= maxDataPoints) {
          trafficChart.data.labels.shift();
          trafficChart.data.datasets[0].data.shift();
          trafficChart.data.datasets[1].data.shift();
        }

        trafficChart.data.labels.push(data.timestamp);
        trafficChart.data.datasets[0].data.push(data.downloadMbps);
        trafficChart.data.datasets[1].data.push(data.uploadMbps);

        trafficChart.update();
      });
    }
  </script>
</body>
</html>
